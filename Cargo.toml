[package]
name = "llm-chess-arena"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gloo = { version = "0.12.0", features = ["futures"] }
js-sys = "0.3.77"
rexie = "0.6.2"
serde = { version = "1", features = ["derive"] }
serde-json-wasm = "1"
serde-wasm-bindgen = "0.6.5"
serde_json = "1"
shakmaty = { version = "0.30.1", features = ["serde"] }
thiserror = "2.0.20"
uuid = { version = "1.24.0", features = ["v4", "serde", "js"] }
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"
web-sys = { version = "0.3.77", features = [
  "Blob", "BlobPropertyBag", "Clipboard", "Document", "DragEvent", "Element",
  "Event", "File", "FileList", "FileReader", "HtmlAnchorElement", "HtmlElement",
  "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "KeyboardEvent",
  "MessageEvent", "Navigator", "StorageManager", "Url", "Window", "Worker"
] }
yew = { version = "0.23.0", features = ["csr"] }

[dev-dependencies]
proptest = "1.11.0"
wasm-bindgen-test = "0.3.77"

